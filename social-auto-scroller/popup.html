<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Social Auto Scroller</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="logo" aria-hidden="true">↓</div>
        <div>
          <h1>Auto Scroller</h1>
          <p id="site">Memuat halaman…</p>
        </div>
        <span id="statusBadge" class="badge idle">Idle</span>
      </header>

      <section class="status-card" aria-live="polite">
        <div>
          <span>Progress</span>
          <strong id="progress">0 langkah</strong>
        </div>
        <div>
          <span>Area</span>
          <strong id="target">Otomatis</strong>
        </div>
        <div>
          <span>Durasi</span>
          <strong id="elapsed">00:00</strong>
        </div>
      </section>

      <section class="settings">
        <label for="distance">
          <span>Jarak per langkah</span>
          <output id="distanceValue">700 px</output>
        </label>
        <input id="distance" type="range" min="200" max="2000" step="100" value="700" />

        <label for="delay">
          <span>Jeda</span>
          <output id="delayValue">1.2 dtk</output>
        </label>
        <input id="delay" type="range" min="500" max="5000" step="100" value="1200" />

        <div class="grid">
          <label class="field" for="idleLimit">
            <span>Batas macet</span>
            <select id="idleLimit">
              <option value="10">10 kali</option>
              <option value="20" selected>20 kali</option>
              <option value="30">30 kali</option>
              <option value="60">60 kali</option>
            </select>
          </label>
          <label class="field" for="maxMinutes">
            <span>Batas waktu</span>
            <select id="maxMinutes">
              <option value="15">15 menit</option>
              <option value="30">30 menit</option>
              <option value="60" selected>60 menit</option>
              <option value="120">120 menit</option>
              <option value="0">Tanpa batas</option>
            </select>
          </label>
        </div>

        <label class="switch-row" for="smooth">
          <span>
            <strong>Scroll halus</strong>
            <small>Lebih natural, sedikit lambat</small>
          </span>
          <input id="smooth" type="checkbox" checked />
        </label>
      </section>

      <section class="target-actions">
        <button id="pick" class="secondary" type="button">Pilih area scroll</button>
        <button id="resetTarget" class="text-button" type="button">Pakai otomatis</button>
      </section>

      <p id="notice" class="notice" hidden></p>

      <footer>
        <button id="start" class="primary" type="button">Mulai</button>
        <button id="pause" class="secondary" type="button" disabled>Jeda</button>
        <button id="stop" class="danger" type="button" disabled>Stop</button>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
